<!-- Power Balance CSS -->
<style>
/* Power Balance Container */
.power-balance-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 800px;
    background: rgba(26, 26, 46, 0.95);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 20px;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
}

/* Header */
.power-balance-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.power-balance-header h3 {
    margin: 0;
    font-size: 1em;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: #94a3b8;
}

.victory-threshold {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9em;
}

.threshold-label {
    color: #64748b;
}

.threshold-value {
    color: #fbbf24;
    font-weight: 500;
}

/* Power Balance Bar */
.power-balance-bar {
    display: flex;
    height: 60px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    position: relative;
    background: rgba(0, 0, 0, 0.3);
}

.balance-segment {
    position: relative;
    transition: all 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Segment backgrounds with gradients */
.usa-segment {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
}

.eu-segment {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
}

.china-segment {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
}

/* Segment content */
.segment-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    position: relative;
    z-index: 2;
}

.bloc-name {
    font-size: 0.8em;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.9);
}

.bloc-vp {
    font-size: 1.2em;
    font-weight: 500;
    color: #fff;
}

/* Animated stripes for leading bloc */
@keyframes moveStripes {
    0% {
        background-position: 0 0;
    }
    100% {
        background-position: 40px 0;
    }
}

.balance-segment.leading::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255, 255, 255, 0.1) 10px,
        rgba(255, 255, 255, 0.1) 20px
    );
    animation: moveStripes 1s linear infinite;
}

/* Victory indicator */
.balance-segment.near-victory {
    box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.5);
}

.balance-segment.near-victory .bloc-vp {
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
}

/* Details Section (Hidden by default) */
.power-details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 20px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
}

.power-details.show {
    max-height: 300px;
}

.detail-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 15px;
}

.usa-detail {
    border-color: #3b82f6;
}

.eu-detail {
    border-color: #10b981;
}

.china-detail {
    border-color: #ef4444;
}

.detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.detail-bloc {
    font-weight: 500;
    font-size: 0.9em;
}

.usa-detail .detail-bloc { color: #3b82f6; }
.eu-detail .detail-bloc { color: #10b981; }
.china-detail .detail-bloc { color: #ef4444; }

.detail-total {
    font-weight: 500;
    color: #fbbf24;
}

.detail-breakdown {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.detail-item {
    display: flex;
    justify-content: space-between;
    font-size: 0.8em;
    color: rgba(255, 255, 255, 0.7);
}

.detail-item.negative .detail-value {
    color: #f87171;
}

.detail-label {
    color: #64748b;
}

.detail-value {
    font-weight: 500;
}

/* Toggle Button */
.toggle-details-btn {
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 26, 46, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #94a3b8;
}

.toggle-details-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateX(-50%) scale(1.1);
}

.toggle-icon {
    transition: transform 0.3s ease;
}

.toggle-icon.rotate {
    transform: rotate(180deg);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .power-balance-container {
        width: 95%;
        padding: 15px;
    }
    
    .balance-segment {
        min-width: 0;
    }
    
    .bloc-name {
        font-size: 0.7em;
    }
    
    .bloc-vp {
        font-size: 1em;
    }
}
</style>

<!-- Power Balance JavaScript -->
<script>
// Power Balance functionality
class PowerBalanceIndicator {
    constructor() {
        this.container = document.getElementById('powerBalance');
        this.segments = {
            usa: document.getElementById('usaSegment'),
            eu: document.getElementById('euSegment'),
            china: document.getElementById('chinaSegment')
        };
        this.vpDisplays = {
            usa: document.getElementById('usaVP'),
            eu: document.getElementById('euVP'),
            china: document.getElementById('chinaVP')
        };
        this.detailsSection = document.getElementById('powerDetails');
        this.toggleBtn = document.getElementById('toggleDetails');
        this.toggleIcon = this.toggleBtn.querySelector('.toggle-icon');
        
        this.victoryThreshold = 50;
        this.currentPower = {
            usa: { vp: 15, gdp: 5, tech: 3, military: 4, culture: 2, cohesion: 3, drag: 2 },
            eu: { vp: 18, gdp: 6, tech: 2, military: 2, culture: 5, cohesion: 4, drag: 1 },
            china: { vp: 17, gdp: 7, tech: 2, military: 3, culture: 3, cohesion: 3, drag: 1 }
        };
        
        this.init();
    }
    
    init() {
        // Set up toggle button
        this.toggleBtn.addEventListener('click', () => {
            this.detailsSection.classList.toggle('show');
            this.toggleIcon.classList.toggle('rotate');
        });
        
        // Initial update
        this.updateDisplay();
    }
    
    updatePower(powerData) {
        // Update power data from game state
        this.currentPower = powerData;
        this.updateDisplay();
    }
    
    updateDisplay() {
        const totalVP = this.currentPower.usa.vp + this.currentPower.eu.vp + this.currentPower.china.vp;
        
        // Update segments
        const usaWidth = (this.currentPower.usa.vp / totalVP) * 100;
        const euWidth = (this.currentPower.eu.vp / totalVP) * 100;
        const chinaWidth = (this.currentPower.china.vp / totalVP) * 100;
        
        this.segments.usa.style.width = usaWidth + '%';
        this.segments.eu.style.width = euWidth + '%';
        this.segments.china.style.width = chinaWidth + '%';
        
        // Update VP displays
        this.vpDisplays.usa.textContent = this.currentPower.usa.vp;
        this.vpDisplays.eu.textContent = this.currentPower.eu.vp;
        this.vpDisplays.china.textContent = this.currentPower.china.vp;
        
        // Find leader and check for near victory
        this.updateLeaderStatus();
        
        // Update details
        this.updateDetails();
    }
    
    updateLeaderStatus() {
        // Remove existing classes
        Object.values(this.segments).forEach(segment => {
            segment.classList.remove('leading', 'near-victory');
        });
        
        // Find leader
        const powers = ['usa', 'eu', 'china'];
        let leader = powers[0];
        let maxVP = this.currentPower[leader].vp;
        
        powers.forEach(power => {
            if (this.currentPower[power].vp > maxVP) {
                leader = power;
                maxVP = this.currentPower[power].vp;
            }
        });
        
        // Add leading class
        this.segments[leader].classList.add('leading');
        
        // Check for near victory (within 10 points)
        if (maxVP >= this.victoryThreshold - 10) {
            this.segments[leader].classList.add('near-victory');
        }
    }
    
    updateDetails() {
        ['usa', 'eu', 'china'].forEach(bloc => {
            const data = this.currentPower[bloc];
            const blocUpper = bloc.toUpperCase();
            
            document.getElementById(`${bloc}Total`).textContent = `${data.vp} VP`;
            document.getElementById(`${bloc}GDP`).textContent = data.gdp;
            document.getElementById(`${bloc}Tech`).textContent = data.tech;
            document.getElementById(`${bloc}Military`).textContent = data.military;
            document.getElementById(`${bloc}Culture`).textContent = data.culture;
            document.getElementById(`${bloc}Cohesion`).textContent = data.cohesion;
            document.getElementById(`${bloc}Drag`).textContent = `-${data.drag}`;
        });
    }
    
    setVictoryThreshold(threshold) {
        this.victoryThreshold = threshold;
        document.getElementById('victoryThreshold').textContent = `${threshold} VP`;
    }
    
    // Animate changes
    animateChange(bloc, oldVP, newVP) {
        const startTime = Date.now();
        const duration = 500;
        
        const animate = () => {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Easing function
            const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
            const easedProgress = easeOutCubic(progress);
            
            const currentVP = Math.round(oldVP + (newVP - oldVP) * easedProgress);
            this.vpDisplays[bloc].textContent = currentVP;
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                this.updateDisplay();
            }
        };
        
        animate();
    }
}

// Initialize power balance indicator
let powerBalance;
document.addEventListener('DOMContentLoaded', () => {
    powerBalance = new PowerBalanceIndicator();
    
    // Connect to WebSocket updates
    if (window.gameWebSocket) {
        const originalOnMessage = window.gameWebSocket.onmessage;
        window.gameWebSocket.onmessage = (event) => {
            if (originalOnMessage) originalOnMessage(event);
            
            const message = JSON.parse(event.data);
            if (message.type === 'power_update' || message.type === 'full_state') {
                // Update power balance from game state
                if (message.data && message.data.blocs) {
                    const powerData = {};
                    message.data.blocs.forEach(bloc => {
                        const name = bloc.name.toLowerCase();
                        powerData[name] = {
                            vp: bloc.victory_points || 0,
                            gdp: bloc.gdp_tokens || 0,
                            tech: bloc.tech_bonus || 0,
                            military: (bloc.military_posture || 0) * 2,
                            culture: bloc.cultural_influence || 0,
                            cohesion: bloc.cohesion || 0,
                            drag: bloc.effective_drag || 0
                        };
                    });
                    powerBalance.updatePower(powerData);
                }
            }
        };
    }
});

// Example of updating power (for testing)
function testPowerUpdate() {
    const oldUSA = powerBalance.currentPower.usa.vp;
    powerBalance.currentPower.usa.vp += 5;
    powerBalance.animateChange('usa', oldUSA, powerBalance.currentPower.usa.vp);
}
</script>
